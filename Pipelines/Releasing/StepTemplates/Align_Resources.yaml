steps:

  - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
    displayName: "Install Terraform dependencies"

  - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV2@2
    displayName: "Terraform init"
    inputs:
      workingDirectory: $(System.DefaultWorkingDirectory)/drop/Terraform
      backendServiceArm: TerraformConnection2
      backendAzureRmResourceGroupName: TerraformStuff
      backendAzureRmStorageAccountName: terraformstuffblob
      backendAzureRmContainerName: terraformstuffblobcontainer
      backendAzureRmKey: tf/terraform.tfstate

  - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV2@2
    displayName: "Terraform apply"
    inputs:
      command: apply
      workingDirectory: $(System.DefaultWorkingDirectory)/drop/Terraform
      environmentServiceNameAzureRM: TerraformConnection2
    env:
      TF_VAR_app_name: $(AppName)
      TF_VAR_app_insights_connection_string: $(ApplicationInsights.ConnectionString)
