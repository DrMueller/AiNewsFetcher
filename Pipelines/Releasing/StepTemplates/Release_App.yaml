steps:
  - task: AzureFunctionApp@2
    displayName: "Azure Function App Deploy"
    inputs:
      connectedServiceNameARM: 'Pay-As-You-Go (91660754-3529-407f-8458-92759935fbf7)'
      appType: functionAppLinux
      appName: $(AppName)
      package: "$(System.DefaultWorkingDirectory)/drop/App/App.zip"
      isFlexConsumption: true
      appSettings: |
        -AppSettings__OpenAiDeploymentName $(AppSettings.OpenAiDeploymentName)
        -AppSettings__OpenAiEndpoint $(AppSettings.OpenAiEndpoint)
        -AppSettings__OpenAiKey $(AppSettings.OpenAiKey)
        -AppSettings__SmtpPassword $(AppSettings.SmtpPassword)
        -AppSettings__SmtpUser $(AppSettings.SmtpUser)
